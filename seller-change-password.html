<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password | EasyBuy</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7ff;color:#172033}.wrap{max-width:520px;margin:8vh auto;padding:24px}.card{background:#fff;border:1px solid #e1e7f2;border-radius:18px;padding:28px;box-shadow:0 12px 35px #1a376a12}h1{margin:0 0 8px;font-size:27px}.muted{color:#667085;line-height:1.5}label{display:block;font-weight:600;margin:18px 0 6px}input{width:100%;padding:12px;border:1px solid #cfd7e6;border-radius:9px;font-size:16px}button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:9px;background:#1749b5;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.notice{margin-top:15px;line-height:1.5}.back{display:inline-block;margin-bottom:16px;color:#1749b5;text-decoration:none}.small{font-size:13px;color:#667085}
</style></head><body><main class="wrap"><a class="back" href="sellerindex.php">← Back to Seller Studio</a><section class="card"><h1>Change password</h1><p class="muted">Enter your current password and choose a new one. No email or reset link is needed.</p><form id="changeForm"><label for="current">Current password</label><input id="current" type="password" autocomplete="current-password" required><label for="new">New password</label><input id="new" type="password" minlength="8" autocomplete="new-password" required><p class="small">Use at least 8 characters.</p><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button><p class="notice" id="notice" role="status"></p></form></section></main><script>
const notice=document.getElementById('notice');
async function getCsrf(){const r=await fetch('seller-auth.php?action=me',{credentials:'same-origin'});const d=await r.json();if(!d.seller||!d.csrf)throw new Error('Please sign in to your seller account first.');return d.csrf;}
document.getElementById('changeForm').addEventListener('submit',async e=>{e.preventDefault();notice.textContent='';const current=document.getElementById('current').value;const next=document.getElementById('new').value;const confirm=document.getElementById('confirm').value;if(next!==confirm){notice.textContent='New password and confirmation do not match.';return;}try{const csrf=await getCsrf();const r=await fetch('api-change-password.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({current_password:current,new_password:next,confirm_password:confirm})});const d=await r.json();notice.textContent=d.message||d.error||'Something went wrong.';if(d.ok){e.target.reset();}}catch(err){notice.textContent=err.message||'Could not connect to EasyBuy.';}});
</script></body></html>
